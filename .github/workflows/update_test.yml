name: Test Tennis Abstract

"on":
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Download ATP Elo
        run: python get_atp_elo_final.py

      - name: Download WTA Elo
        run: python get_wta_elo_final.py
