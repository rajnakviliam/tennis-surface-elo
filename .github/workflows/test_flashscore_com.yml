name: Test Flashscore COM

on:
  workflow_dispatch:

jobs:
  test-flashscore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Test Flashscore.com
        run: |
          python test_flashscore_com.py

      - name: Show result
        run: |
          echo "===== POČET RIADKOV ====="
          wc -l flashscore_com_test.csv

          echo ""
          echo "===== PRVÝCH 40 RIADKOV ====="
          head -40 flashscore_com_test.csv

      - name: Upload test files
        uses: actions/upload-artifact@v4
        with:
          name: flashscore-com-test
          path: |
            flashscore_com_test.csv
            data/raw_flashscore_com/
